<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムスピード・テトリス</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --warning-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 500px;
      width: 100%;
    }

    .header-panel {
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .main-area {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      position: relative;
    }

    canvas#tetris {
      background: #020617;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-box {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      width: 110px;
      text-align: center;
    }

    .info-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .info-val {
      font-size: 1.1rem;
      font-weight: bold;
    }

    #speed-indicator {
      transition: color 0.3s;
    }

    canvas#next {
      background: #020617;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      margin-top: 4px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 320px;
    }

    .btn {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--text-color);
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.1s;
    }

    .btn:active {
      background: var(--accent-color);
      color: #000;
    }

    .btn-wide {
      grid-column: span 3;
      background: #0284c7;
      border-color: #38bdf8;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      z-index: 50;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <div class="header-panel">
    <div class="title">RANDOM TETRIS</div>
    <div id="mode-badge" style="font-size: 0.8rem; padding: 4px 8px; background: #334155; border-radius: 4px;">NORMAL MODE</div>
  </div>

  <div class="main-area">
    <canvas id="tetris" width="240" height="400"></canvas>

    <div class="side-panel">
      <div class="info-box">
        <div class="info-label">SCORE</div>
        <div id="score" class="info-val">0</div>
      </div>
      
      <div class="info-box">
        <div class="info-label">SPEED LV</div>
        <div id="speed-indicator" class="info-val">Lv.5</div>
      </div>

      <div class="info-box">
        <div class="info-label">NEXT</div>
        <canvas id="next" width="80" height="80"></canvas>
      </div>
    </div>

    <!-- スタート / ゲームオーバー画面 -->
    <div id="overlay" class="overlay">
      <h2 id="overlay-title" style="margin-bottom: 8px; color: var(--accent-color);">READY?</h2>
      <p id="overlay-msg" style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 16px; text-align: center; padding: 0 10px;">1000点を超えると<br>速度がランダム変化！</p>
      <button class="btn" style="padding: 10px 24px; font-size: 1rem; background: #0284c7;" onclick="startGame()">START</button>
    </div>
  </div>

  <!-- タッチ操作ボタン -->
  <div class="controls">
    <div class="btn" onclick="playerMove(-1)">◀</div>
    <div class="btn" onclick="playerRotate()">🔄</div>
    <div class="btn" onclick="playerMove(1)">▶</div>
    <div class="btn" onclick="playerDrop()">▼</div>
    <div class="btn btn-wide" onclick="playerHardDrop()">HARD DROP (SPACE)</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('tetris');
  const context = canvas.getContext('2d');
  context.scale(20, 20);

  const nextCanvas = document.getElementById('next');
  const nextContext = nextCanvas.getContext('2d');
  nextContext.scale(20, 20);

  const SPEED_LEVELS = [1200, 1000, 800, 650, 500, 380, 260, 160, 90, 45];

  const PIECES = [
    { shape: [[0,0,0],[1,1,1],[0,1,0]], color: '#a855f7' }, // T
    { shape: [[2,2],[2,2]], color: '#eab308' },             // O
    { shape: [[0,3,0,0],[0,3,0,0],[0,3,0,0],[0,3,0,0]], color: '#06b6d4' }, // I
    { shape: [[0,4,4],[4,4,0],[0,0,0]], color: '#22c55e' }, // S
    { shape: [[5,5,0],[0,5,5],[0,0,0]], color: '#ef4444' }, // Z
    { shape: [[6,0,0],[6,6,6],[0,0,0]], color: '#3b82f6' }, // J
    { shape: [[0,0,7],[7,7,7],[0,0,0]], color: '#f97316' }  // L
  ];

  function createMatrix(w, h) {
    const matrix = [];
    while (h--) matrix.push(new Array(w).fill(0));
    return matrix;
  }

  let arena = createMatrix(12, 20);

  const player = {
    pos: {x: 0, y: 0},
    matrix: null,
    color: '',
    next: null,
    score: 0
  };

  let dropCounter = 0;
  let dropInterval = SPEED_LEVELS[4];
  let lastTime = 0;
  let isRandomMode = false;
  let isRunning = false;
  let animId = null;

  function resetPlayer() {
    if (!player.next) {
      player.next = PIECES[Math.floor(Math.random() * PIECES.length)];
    }
    const currentPiece = player.next;
    player.matrix = currentPiece.shape;
    player.color = currentPiece.color;
    player.next = PIECES[Math.floor(Math.random() * PIECES.length)];
    
    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

    if (collide(arena, player)) {
      isRunning = false;
      document.getElementById('overlay-title').innerText = "GAME OVER";
      document.getElementById('overlay-msg').innerText = `FINAL SCORE: ${player.score}`;
      document.getElementById('overlay').classList.remove('hidden');
      return;
    }

    if (player.score >= 1000) {
      if (!isRandomMode) {
        isRandomMode = true;
        const badge = document.getElementById('mode-badge');
        badge.innerText = "RANDOM SPEED!";
        badge.style.background = "#f43f5e";
      }
      const randomIdx = Math.floor(Math.random() * SPEED_LEVELS.length);
      dropInterval = SPEED_LEVELS[randomIdx];
      
      const speedIndicator = document.getElementById('speed-indicator');
      speedIndicator.innerText = `Lv.${randomIdx + 1}`;
      speedIndicator.style.color = randomIdx >= 7 ? '#f43f5e' : (randomIdx <= 2 ? '#22c55e' : '#f8fafc');
    }

    drawNext();
  }

  function collide(arena, player) {
    const [m, o] = [player.matrix, player.pos];
    for (let y = 0; y < m.length; ++y) {
      for (let x = 0; x < m[y].length; ++x) {
        if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
          return true;
        }
      }
    }
    return false;
  }

  function merge(arena, player) {
    player.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          arena[y + player.pos.y][x + player.pos.x] = player.color;
        }
      });
    });
  }

  function arenaSweep() {
    let rowCount = 1;
    outer: for (let y = arena.length - 1; y >= 0; --y) {
      for (let x = 0; x < arena[y].length; ++x) {
        if (arena[y][x] === 0) continue outer;
      }
      const row = arena.splice(y, 1)[0].fill(0);
      arena.unshift(row);
      ++y;

      player.score += rowCount * 100;
      rowCount *= 2;
    }
    document.getElementById('score').innerText = player.score;
  }

  function playerDrop() {
    if (!isRunning) return;
    player.pos.y++;
    if (collide(arena, player)) {
      player.pos.y--;
      merge(arena, player);
      arenaSweep();
      resetPlayer();
    }
    dropCounter = 0;
  }

  function playerHardDrop() {
    if (!isRunning) return;
    while (!collide(arena, player)) {
      player.pos.y++;
    }
    player.pos.y--;
    merge(arena, player);
    arenaSweep();
    resetPlayer();
    dropCounter = 0;
  }

  function playerMove(dir) {
    if (!isRunning) return;
    player.pos.x += dir;
    if (collide(arena, player)) {
      player.pos.x -= dir;
    }
  }

  function playerRotate() {
    if (!isRunning) return;
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix);
    while (collide(arena, player)) {
      player.pos.x += offset;
      offset = -(offset + (offset > 0 ? 1 : -1));
      if (offset > player.matrix[0].length) {
        rotate(player.matrix, -1);
        player.pos.x = pos;
        return;
      }
    }
  }

  function rotate(matrix, dir = 1) {
    for (let y = 0; y < matrix.length; ++y) {
      for (let x = 0; x < y; ++x) {
        [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
      }
    }
    if (dir > 0) matrix.forEach(row => row.reverse());
    else matrix.reverse();
  }

  function drawMatrix(matrix, offset, ctx, colorOverride = null) {
    matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          ctx.fillStyle = colorOverride || (typeof value === 'string' ? value : player.color);
          ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
          ctx.strokeStyle = '#020617';
          ctx.lineWidth = 0.05;
          ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
        }
      });
    });
  }

  function drawNext() {
    nextContext.fillStyle = '#020617';
    nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (player.next) {
      const offsetX = (4 - player.next.shape[0].length) / 2;
      const offsetY = (4 - player.next.shape.length) / 2;
      drawMatrix(player.next.shape, {x: offsetX, y: offsetY}, nextContext, player.next.color);
    }
  }

  function draw() {
    context.fillStyle = '#020617';
    context.fillRect(0, 0, canvas.width, canvas.height);

    arena.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          context.fillStyle = value;
          context.fillRect(x, y, 1, 1);
          context.strokeStyle = '#020617';
          context.lineWidth = 0.05;
          context.strokeRect(x, y, 1, 1);
        }
      });
    });

    if (player.matrix) {
      drawMatrix(player.matrix, player.pos, context);
    }
  }

  function update(time = 0) {
    if (!isRunning) return;

    const deltaTime = time - lastTime;
    lastTime = time;

    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
      playerDrop();
    }

    draw();
    animId = requestAnimationFrame(update);
  }

  function startGame() {
    arena = createMatrix(12, 20);
    player.score = 0;
    isRandomMode = false;
    dropInterval = SPEED_LEVELS[4];
    
    document.getElementById('score').innerText = '0';
    document.getElementById('speed-indicator').innerText = 'Lv.5';
    document.getElementById('speed-indicator').style.color = '#f8fafc';
    document.getElementById('mode-badge').innerText = 'NORMAL MODE';
    document.getElementById('mode-badge').style.background = '#334155';

    // オーバーレイを隠す
    document.getElementById('overlay').classList.add('hidden');

    player.next = null;
    resetPlayer();
    isRunning = true;
    lastTime = performance.now();
    if (animId) cancelAnimationFrame(animId);
    update();
  }

  document.addEventListener('keydown', event => {
    if (!isRunning) return;
    if (event.keyCode === 37) playerMove(-1);
    else if (event.keyCode === 39) playerMove(1);
    else if (event.keyCode === 40) playerDrop();
    else if (event.keyCode === 38) playerRotate();
    else if (event.keyCode === 32) playerHardDrop();
  });
</script>

</body>
</html>
